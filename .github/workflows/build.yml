name: Build and Release JNI Libraries

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android NDK Libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build aarch64
        run: cargo ndk -t aarch64-linux-android build --release

      - name: Build armv7
        run: cargo ndk -t armv7-linux-androideabi build --release

      - name: Build x86_64
        run: cargo ndk -t x86_64-linux-android build --release

      - name: Build i686
        run: cargo ndk -t i686-linux-android build --release

      - name: Prepare Artifacts
        run: |
          mkdir -p release-libs/jniLibs/arm64-v8a
          mkdir -p release-libs/jniLibs/armeabi-v7a
          mkdir -p release-libs/jniLibs/x86_64
          mkdir -p release-libs/jniLibs/x86
          
          cp target/aarch64-linux-android/release/libbbf.so release-libs/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libbbf.so release-libs/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libbbf.so release-libs/jniLibs/x86_64/
          cp target/i686-linux-android/release/libbbf.so release-libs/jniLibs/x86/
          
          cp -r java release-libs/
          cp -r kotlin release-libs/
          
          zip -r libbbf-android-release.zip release-libs/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libbbf-android-release
          path: libbbf-android-release.zip

  create_release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: libbbf-android-release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: libbbf-android-release.zip
          generate_release_notes: true